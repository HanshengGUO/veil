# artifact.yaml — normalized veil.artifact.v0 manifest shape
#
# This object is generated by @veilquant/engine, not completed by hand. Local code roots are used
# only while capturing the explicit file set; they never enter this manifest or its identity.

format: veil.artifact.v0

factor:
  runtime:
    id: python                    # logical runtime provider; no executable path
    constraint: ">=3.11,<4"       # portable version constraint
  entry:
    file: factor.py               # must be one of code.files[].logicalName
    callable: compute             # compute(data_view); subprocess protocol lands in Stage 2C-2
  code:
    format: veil.artifact-code.v0
    files:                        # explicit, unique, sorted, root-relative regular files
      - logicalName: factor.py
        byteLength: <int>         # computed from exact bytes
        contentHash: <sha256>
      - logicalName: requirements.lock
        byteLength: <int>
        contentHash: <sha256>
    treeHash: <sha256>            # computed over the normalized file manifest

paramsLocked:                     # C3: immutable out of sample
  lookbackDays: 20

declaredLiterals:                 # only data-derived numeric literals; also immutable under C3
  selectedThreshold: 1.5

trialsDeclared: 3                 # total explored candidates including this artifact

dataSemantics:
  datasets:                       # normalized and sorted adapter identities
    - dataset: prices
      version: "1"
      declarationHash: <sha256>
      developmentReadSets:         # exact exploration evidence used before promotion
        - <sha256>                  # per-window WFA read-sets belong to execution records instead

hypothesisRef: momentum-v1        # C6 registration reference

protocol:                         # C2 inputs are frozen before OOS execution
  mode: expanding                 # rolling | expanding
  folds: 6
  trainDays: 504                  # rolling length or initial expanding length
  oosDays: 63
  purgeDays: 5                    # must be >= holdDays
  embargoDays: 2                  # must be non-zero
  holdDays: 5

costModel: equities-bps-v1        # logical plugin reference, never a DSN/path
artifactHash: <sha256>             # computed over every field above except artifactHash itself

# paramsLocked and declaredLiterals accept only canonical JSON values. Absolute paths, credential-
# named fields, inline credential URLs, non-finite numbers, -0, class instances, and cyclic values
# are rejected so machine-local state cannot silently enter a portable artifact identity.
