# adapter.yaml — portable dataset declaration
#
# This file documents the wire format accepted by normalizeAdapterDeclaration(). The declaration
# contains data meaning, not runtime credentials. YAML file I/O and SourceBinding resolution belong
# to @veilquant/engine.

dataset: <string>                 # required; registry name: letters/digits/dot/_/-
version: <string>                 # required; bump when meaning changes, not when rows are appended

entity_key: <column>              # required; instrument / contract / research subject
event_time: <column>              # required; when the event happened
available_time: <column|null>     # required; when the row could first be known
                                  # null => event_time fallback + PIT_UNSAFE degradation

# Required when available_time is not null; forbidden when it is null. A plain `observed` shorthand
# covers the whole dataset. reconstructed/assumed need evidence, so use an object or segments.
# Segment boundaries select rows by event_time and use [from, until): from inclusive, until exclusive.
availability_basis:
  - until: 2026-08-07             # date-only means 00:00:00Z
    basis: reconstructed           # observed | reconstructed | assumed
    source: vendor publish_date    # required for reconstructed
  - from: 2026-08-07
    basis: observed                # observed evidence is cross-checked through lineage

# A whole-range assumption is also valid:
# availability_basis:
#   basis: assumed
#   lag: P2D                       # positive ISO-8601 duration; required for assumed
#   rationale: vendor SLA says filings arrive within two days

frequency: <string>               # optional; 1m | 1d | irregular | ...

guarantees:                       # optional; omitted fields take conservative defaults
  point_in_time: <bool>           # default false; true contradicts available_time: null
  vintage: <bool>                 # default false; true only when revisions are append-only rows
  survivorship_free: <bool|unknown>  # default unknown
  tradability_mask: <column|null> # default null; boolean mask applied before signal formation

provenance:                       # optional; absence means uncertified, which is a normal state
  certified: <bool>               # default false
  lineage_ref: <uri|sha256|null>  # required when certified=true; resolved by the engine

payload_schema:                   # optional; exact source column -> Arrow type
  <column>: <arrow_type>

source:                           # required; portable and non-secret
  type: <parquet|csv|duckdb|dolphindb|clickhouse|custom>
  locator: <string>               # local relative path/glob or logical table name
                                  # paths, DSNs, tokens and passwords are runtime SourceBinding data

# Stage 7 deployment alignment. Optional now; when present all four fields are required.
time_semantics:
  bar_labeling: <open|close|na>
  timestamp_basis: <exchange|receipt|processed>
  timezone: <string>              # IANA name, e.g. Asia/Hong_Kong
  latency_class: <realtime|delayed|eod>

notes: <string>                   # optional; known limitations in plain language

# ---------------------------------------------------------------------------
# Minimal honest declaration: no availability timestamp.
#
# dataset: alt_news_sentiment
# version: "2024-11"
# entity_key: ticker
# event_time: published_at
# available_time: null
# frequency: irregular
# payload_schema:
#   sentiment: float32
#   source: utf8
# source:
#   type: csv
#   locator: data/news.csv
# notes: Vendor supplies no receipt timestamp; intraday conclusions are unsupported.
#
# Normalized consequences:
#   FILTER_EVENT_TIME, PIT_UNSAFE, POINT-IN-TIME conclusions degraded.

# ---------------------------------------------------------------------------
# Typical vendor history: reconstructed backfill, then genuinely observed feed.
#
# dataset: vendor_fundamentals
# version: "2026-08"
# entity_key: ticker
# event_time: period_end
# available_time: first_known_at
# availability_basis:
#   - { until: 2026-08-07, basis: reconstructed, source: vendor publish_date }
#   - { from: 2026-08-07, basis: observed }
# guarantees:
#   point_in_time: true
#   vintage: true
#   survivorship_free: true
# provenance:
#   certified: true
#   lineage_ref: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
# source:
#   type: parquet
#   locator: fundamentals/**/*.parquet
