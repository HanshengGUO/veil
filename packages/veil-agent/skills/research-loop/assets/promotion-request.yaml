format: veil.promotion-request.v0
dataset: replace-with-project-dataset
hypothesis_ref: replace-with-veil-memory-reference
factor:
  code_root: .veil/artifact
  files:
    - factor.mjs
  runtime:
    id: veil-node
    constraint: ">=20.10.0,<30"
  entry:
    file: factor.mjs
    callable: compute
params_locked:
  lookback_days: 20
declared_literals: {}
trials_declared: 1
development_read_sets:
  - sha256:replace-with-a-read-set-id
protocol:
  mode: rolling
  folds: 2
  train_days: 60
  oos_days: 20
  purge_days: 5
  embargo_days: 5
  hold_days: 5
  execution_lag_days: 1
# Supply every ordered UTC session, not one timestamp per fold. The protocol above requires exactly
# 60 + 5 + 5 + (2 * 20) = 110 entries. Replace the empty list after choosing an honest protocol.
decision_schedule: []
columns:
  - ticker
  - close
# This is a portable logical id, not a filesystem path or locator URI. Replace it when Stage 4 issues a
# registered method reference; Stage 3 does not apply costs.
cost_model: stage4-not-issued
