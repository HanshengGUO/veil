name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every supported Node version on Linux; the newest on macOS and Windows. The golden path is
      # reproduced on all three platforms, which is the point of the matrix: identical inputs must
      # produce identical metrics regardless of OS or architecture.
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # lint, typecheck, tests, DuckDB/Arrow cold runtime probe, bench smoke, and golden path
      - run: npm run check

      - name: Record parameterized bench smoke metadata
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run --silent bench:smoke -- --json --variant ci-${{ github.sha }} > bench-smoke.json

      - name: Upload bench smoke history
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: bench-smoke-${{ github.sha }}
          path: bench-smoke.json
          retention-days: 90
