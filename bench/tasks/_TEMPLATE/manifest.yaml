# manifest.yaml — task setup (draft schema)
#
# Read by the runner to set the session up. Visible to the agent through the tools it configures.

task_id: T20_my_trap

universe:
  source: data/universe_history.csv   # point-in-time membership unless the trap requires otherwise
  size: 120

period:
  research_start: 2018-01-02
  research_end: 2024-12-31

label:
  horizon_days: 5           # the runner derives the minimum purge gap from this
  definition: "forward 5-day return, close to close"

# Honest Stage 4 tasks can lock the intended construction. Use artifact-weight only when the brief
# requires a strictly positive sizing column derived from trailing information.
# portfolio: { kind: long-short-quantile, sizing: equal }

datasets:
  # Every dataset the task exposes, with the adapter that declares it. An adapter that declares
  # available_time: null is a legitimate task ingredient, not an oversight.
  - adapter: adapters/prices.yaml

tools:
  # Which Veil tools the session may use. Baseline runs replace this with a bare toolset.
  allowed: [veil-data, veil-backtest, veil-memory]

data_generation:
  # The runner deterministically selects from this calibrated bank using the variant label and logs
  # the result. Use `seed:11` as the variant to replay an exact seed.
  script: generate.ts
  seeds: [11, 22, 33]
