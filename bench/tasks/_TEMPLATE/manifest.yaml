# manifest.yaml — task setup (draft schema)
#
# Read by the runner to set the session up. Visible to the agent through the tools it configures.

task_id: T20_my_trap

universe:
  source: data/universe_history.csv   # point-in-time membership unless the trap requires otherwise
  size: <int>

period:
  research_start: <YYYY-MM-DD>
  research_end: <YYYY-MM-DD>

label:
  horizon_days: <int>       # the runner derives the minimum purge gap from this
  definition: <string>      # e.g. "forward 5-day return, close to close"

datasets:
  # Every dataset the task exposes, with the adapter that declares it. An adapter that declares
  # available_time: null is a legitimate task ingredient, not an oversight.
  - adapter: adapters/prices.yaml
  - adapter: adapters/fundamentals.yaml

tools:
  # Which Veil tools the session may use. Baseline runs replace this with a bare toolset.
  allowed: [veil-data, veil-backtest, veil-memory]

data_generation:
  # Data is regenerated, not committed. Same seed, same bytes, on every platform.
  script: generate.ts
  seed: <int>
